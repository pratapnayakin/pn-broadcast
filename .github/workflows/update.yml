name: Update News Feed

# The site builder. It is normally triggered by the Feed Tick workflow on a
# fixed grid, because GitHub's own cron scheduler backs up by hours on public
# repos. The schedule trigger below is only a rare backstop; the cron here
# is hourly at an off-minute so it never collides with the grid.
#
# To change the refresh rate, edit INTERVAL_MINUTES in tick.yml.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Internal. work builds the site, tick advances the grid.'
        required: false
        default: 'work'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Lint runs as its own job, in parallel with the build. A style error
  # shows up as a red job but must never stop the feeds from deploying.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # The build needs only rss-parser. Skipping devDependencies keeps
        # the deploy path free of the linter, so a lint problem can never
        # block a deploy.
        run: npm ci --omit=dev

      - name: Generate deduplicated feed
        run: node dedup.js

      - name: Restore notify state
        uses: actions/cache/restore@v4
        with:
          path: .notify-state.json
          key: notify-state-${{ github.run_id }}
          restore-keys: |
            notify-state-

      - name: Send notifications
        run: node notify.js
        continue-on-error: true

      - name: Save notify state
        uses: actions/cache/save@v4
        with:
          path: .notify-state.json
          key: notify-state-${{ github.run_id }}
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4